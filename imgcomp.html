<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="免费图片压缩工具，本地压缩不上传，可调质量与尺寸。">
  <title>图片压缩工具 - 无需上传在线压缩 - 114工具箱</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://114448.xyz/imgcomp.html">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">
    </a>
    <a class="back" href="index.html">← 返回目录</a>
  </header>
  <main class="container">
    <h1 class="page-title">图片压缩工具</h1>
    <p class="page-sub">本地压缩图片，数据不会上传服务器</p>
    <div class="panel">
      <div class="dropzone" id="drop" tabindex="0" role="button" aria-label="选择或拖入图片">
        <p>点击选择图片，或将图片拖到这里</p>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <img id="preview" alt="原图预览" hidden>
      <div id="ctrl" hidden>
        <div class="row">
          <div class="field" style="flex:2;margin-bottom:0">
            <label>质量 <span id="qText">80%</span></label>
            <input type="range" id="quality" min="10" max="100" value="80" step="5">
          </div>
          <div class="field" style="flex:1;margin-bottom:0">
            <label>最大边</label>
            <select id="maxEdge">
              <option value="0" selected>原尺寸</option>
              <option value="2048">2048px</option>
              <option value="1280">1280px</option>
              <option value="800">800px</option>
            </select>
          </div>
          <div class="field" style="flex:1;margin-bottom:0">
            <label>格式</label>
            <select id="format">
              <option value="auto" selected>自动</option>
              <option value="image/jpeg">JPEG</option>
              <option value="image/webp">WebP</option>
              <option value="image/png">PNG</option>
            </select>
          </div>
        </div>
        <div class="out" id="out"></div>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="download" disabled>下载压缩图片</button>
        </div>
      </div>
      <div class="hint" id="status">支持 JPG / PNG / WebP，图片全程在本地处理，不会上传。</div>
    </div>
  </main>
  <script src="assets/js/imgcomp.js"></script>
  <script src="assets/js/ui.js"></script>
</body>
</html>
