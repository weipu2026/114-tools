<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="免费屏幕常亮工具，阻止屏幕变暗与休眠，原生 Wake Lock。">
  <title>屏幕常亮工具 - 阻止息屏 - 114工具箱</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">
    </a>
    <a class="back" href="index.html">← 返回目录</a>
  </header>
  <main class="container">
    <h1 class="page-title">屏幕常亮工具</h1>
    <p class="page-sub">点击开启后，阻止屏幕变暗与休眠（基于浏览器原生 Wake Lock）</p>
    <div class="panel" style="text-align:center">
      <div class="keybox" id="state" style="margin-bottom:16px">屏幕当前状态：待机</div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="toggle">开启常亮</button>
      </div>
      <div class="hint" id="status">说明：使用浏览器原生 Screen Wake Lock API，无任何外部依赖。需在 HTTPS 或 localhost 下使用。</div>
    </div>
  </main>
  <script src="assets/js/wakelock.js"></script>
  <script src="assets/js/ui.js"></script>
</body>
</html>
