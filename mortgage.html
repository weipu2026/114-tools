<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026年最新房贷计算器，支持等额本息/等额本金，默认5年期LPR 3.5%，首付最低15%，一键算月供与利息。">
  <title>房贷计算器 - 2026最新LPR利率 - 等额本息等额本金 - 114工具箱</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://114448.xyz/mortgage">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html"></a>
    <a class="back" href="index.html">← 返回目录</a>
  </header>
  <main class="container">
    <h1 class="page-title">房贷计算器</h1>
    <p class="page-sub">按2026年8月最新标准：5年期以上LPR 3.5% · 首套房首付最低15% · 公积金首套利率2.6%</p>
    <div class="panel">
      <div class="row">
        <div class="field" style="flex:1;margin-bottom:0">
          <label>房屋总价（万元）</label>
          <input type="number" id="price" value="100" min="0" step="0.1">
        </div>
        <div class="field" style="flex:1;margin-bottom:0">
          <label>首付比例（%）</label>
          <input type="number" id="down" value="15" min="10" max="100" step="1">
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="field" style="flex:1;margin-bottom:0">
          <label>贷款年限（年）</label>
          <input type="number" id="years" value="30" min="1" max="30" step="1">
        </div>
        <div class="field" style="flex:1;margin-bottom:0">
          <label>年利率（%）</label>
          <input type="number" id="rate" value="3.5" min="0" max="20" step="0.01">
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="field" style="flex:1;margin-bottom:0">
          <label>还款方式</label>
          <select id="mode">
            <option value="ei" selected>等额本息</option>
            <option value="ep">等额本金</option>
          </select>
        </div>
      </div>
      <div class="hint" style="margin-top:6px">利率参考：2026年8月20日 LPR 1年期3.0% / 5年期以上3.5%（连续15个月不变）· 公积金首套2.6% · 实际利率以银行审批为准</div>
      <div class="result" id="out" style="margin-top:14px"></div>
      <div id="detail" style="overflow:auto;margin-top:8px"></div>
      <div class="hint" id="status" style="margin-top:8px"></div>
    </div>
  </main>
  <script src="assets/js/mortgage.js"></script>
  <script src="assets/js/ui.js"></script>
</body>
</html>
