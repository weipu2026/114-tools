<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="免费在线倒计时器，自定义时长，支持开始、暂停、重置。">
  <title>倒计时器在线工具 - 114工具箱</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://114448.xyz/countdown.html">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">
    </a>
    <a class="back" href="index.html">← 返回目录</a>
  </header>
  <main class="container">
    <h1 class="page-title">倒计时器</h1>
    <p class="page-sub">自行填写时长，开始 / 暂停 / 重置</p>
    <div class="panel countdown">
      <div class="cd-inputs">
        <div class="field">
          <label>时</label>
          <input type="number" id="h" min="0" value="0">
        </div>
        <div class="field">
          <label>分</label>
          <input type="number" id="m" min="0" value="5">
        </div>
        <div class="field">
          <label>秒</label>
          <input type="number" id="s" min="0" value="0">
        </div>
      </div>
      <div class="cd-presets">
        <button class="chip" data-min="1">1 分钟</button>
        <button class="chip" data-min="5">5 分钟</button>
        <button class="chip" data-min="10">10 分钟</button>
        <button class="chip" data-min="25">25 分钟</button>
      </div>
      <div class="cd-display" id="disp">00:00:00</div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="start">开始</button>
        <button class="btn ghost" id="pause">暂停</button>
        <button class="btn ghost" id="reset">重置</button>
      </div>
      <div class="hint" id="status">就绪</div>
    </div>
  </main>
  <script src="assets/js/countdown.js"></script>
  <script src="assets/js/ui.js"></script>
</body>
</html>
