<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="免费随机密码生成器，高强度随机密码，自定义长度与字符类型。">
  <title>随机密码生成器在线工具 - 114工具箱</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://114448.xyz/password">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">
    </a>
    <a class="back" href="index.html">← 返回目录</a>
  </header>
  <main class="container">
    <h1 class="page-title">随机密码生成器</h1>
    <p class="page-sub">高强度随机密码，使用浏览器加密级随机数生成</p>
    <div class="panel">
      <div class="result" id="out">点击下方按钮生成密码</div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="gen">生成密码</button>
        <button class="btn ghost" id="copy">复制</button>
      </div>

      <div class="field" style="margin-top:18px">
        <label>密码长度：<b id="lenVal">16</b> 位</label>
        <input type="range" id="len" min="4" max="64" value="16" style="width:100%">
      </div>

      <div class="options">
        <label><input type="checkbox" id="upper" checked> 大写字母 A-Z</label>
        <label><input type="checkbox" id="lower" checked> 小写字母 a-z</label>
        <label><input type="checkbox" id="digit" checked> 数字 0-9</label>
        <label><input type="checkbox" id="symbol" checked> 符号 !@#$%…</label>
        <label><input type="checkbox" id="amb"> 排除易混淆字符 (0 O o l 1 I)</label>
      </div>

      <div class="hint" id="strength">强度：—</div>
    </div>
  </main>
  <script src="assets/js/password.js"></script>
  <script src="assets/js/ui.js"></script>
</body>
</html>
