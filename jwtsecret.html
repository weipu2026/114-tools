<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="免费在线 JWT 密钥生成器，加密级随机生成 HS256/HS384/HS512 所需密钥，支持 Base64、Base64URL、Hex 编码。">
  <title>JWT 密钥生成器 - 在线生成 JWT Secret - 114工具箱</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://114448.xyz/jwtsecret.html">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">
    </a>
    <a class="back" href="index.html">← 返回目录</a>
  </header>
  <main class="container">
    <h1 class="page-title">JWT 密钥生成器</h1>
    <p class="page-sub">加密级随机生成 JWT 签名密钥（HS256 / HS384 / HS512）</p>
    <div class="panel">
      <div class="row">
        <div class="field" style="flex:1;margin-bottom:0">
          <label>密钥长度（字节）</label>
          <input type="number" id="bytes" value="32" min="16" max="256" step="1">
        </div>
        <div class="field" style="flex:1;margin-bottom:0">
          <label>输出编码</label>
          <select id="enc">
            <option value="base64" selected>Base64</option>
            <option value="base64url">Base64URL</option>
            <option value="hex">Hex</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="gen">生成密钥</button>
        <button class="btn ghost" id="copy">复制</button>
      </div>
      <div class="result" id="out" style="word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">点击上方按钮生成密钥</div>
      <div class="hint" id="status">说明：基于浏览器 crypto.getRandomValues 加密级随机，仅在本机生成、不上传。HS256 建议至少 32 字节（256 位），HS384/HS512 建议 48/64 字节。</div>
    </div>
  </main>
  <script src="assets/js/jwtsecret.js"></script>
  <script src="assets/js/ui.js"></script>
</body>
</html>
