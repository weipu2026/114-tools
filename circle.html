<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="免费在线圆要素转换器，半径、直径、周长、面积知一求三。">
  <title>圆要素转换器在线工具 - 114工具箱</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">
    </a>
    <a class="back" href="index.html">← 返回目录</a>
  </header>
  <main class="container">
    <h1 class="page-title">圆要素转换器</h1>
    <p class="page-sub">输入 半径 / 直径 / 周长 / 面积 中的任意一个，自动算出其余三个</p>
    <div class="panel">
      <div class="grid2">
        <div class="field">
          <label>半径 r</label>
          <input type="number" id="r" step="any" placeholder="如 5" min="0">
        </div>
        <div class="field">
          <label>直径 d</label>
          <input type="number" id="d" step="any" placeholder="如 10" min="0">
        </div>
        <div class="field">
          <label>周长 C</label>
          <input type="number" id="c" step="any" placeholder="如 31.42" min="0">
        </div>
        <div class="field">
          <label>面积 A</label>
          <input type="number" id="a" step="any" placeholder="如 78.54" min="0">
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn ghost" id="clear">清空</button>
      </div>
      <div class="hint" id="status">说明：半径、直径、周长使用同一长度单位，面积为该长度单位的平方。任填一项即实时计算其余三项。</div>
    </div>
  </main>
  <script src="assets/js/circle.js"></script>
  <script src="assets/js/ui.js"></script>
</body>
</html>
